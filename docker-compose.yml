services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: profound
      POSTGRES_USER: profound
      POSTGRES_PASSWORD: profound
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U profound"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
